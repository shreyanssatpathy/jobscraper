name: Refresh job data

# Tier 1 is cheap (one request per board, most return 304); Workday is not
# (20 rows per request, no caching), so they run on separate schedules.
on:
  # GitHub's scheduler is best-effort: runs are delayed under load and dropped
  # outright when the queue is deep. Measured delivery on this repo was ~27% of
  # requested slots, with one Workday run 3.5 hours late. Actions minutes are
  # unlimited on a public repo, so we ask for more slots than we need and let
  # GitHub drop some.
  schedule:
    - cron: '*/15 * * * *'             # Tier 1, 4x an hour
    - cron: '15 1,5,9,13,17,21 * * *'  # Workday, 6x a day
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to poll
        type: choice
        default: tier1
        options: [tier1, workday, all]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two refreshes race: the database is a single SQLite file.
concurrency:
  group: jobscraper-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick tier
        id: tier
        run: |
          # Only the Workday cron is matched explicitly; everything else is
          # Tier 1. A cron string edited here without updating this case would
          # otherwise fall through to tier1 and silently never poll Workday.
          case "${{ github.event.schedule }}" in
            "15 1,5,9,13,17,21 * * *") TIER=workday ;;
            "") TIER="${{ inputs.tier || 'tier1' }}" ;;
            *)  TIER=tier1 ;;
          esac
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "schedule='${{ github.event.schedule }}' -> tier=$TIER"

      # State carries across runs as a gzipped SQLite file (~15 MB). Without it
      # every run would look like a first crawl and first_seen_at would reset,
      # which is the whole basis of "new since last time".
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: jobs.db.gz
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Unpack database
        run: |
          if [ -f jobs.db.gz ]; then
            gunzip -kf jobs.db.gz
            echo "restored from cache: $(du -h jobs.db | cut -f1)"
          else
            # Cold start: fall back to the committed seed so first_seen_at
            # history survives rather than every posting looking brand new.
            gunzip -c seed/jobs.db.gz > jobs.db
            echo "cold start, seeded from seed/jobs.db.gz: $(du -h jobs.db | cut -f1)"
          fi

      - name: Sync board list
        run: python -m jobscraper.cli import sources.yaml

      - name: Poll
        run: |
          case "${{ steps.tier.outputs.tier }}" in
            tier1)   ARGS="--only greenhouse ashby lever smartrecruiters recruitee rippling breezy bamboohr" ;;
            workday) ARGS="--only workday" ;;
            all)     ARGS="" ;;
          esac
          python -m jobscraper.cli poll $ARGS

      - name: Build dashboard
        run: |
          python -m jobscraper.cli dashboard --out dashboard.html
          python -m jobscraper.cli stats

      - name: Pack database
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("jobs.db")
          # Payloads are only needed for roles that matched the filter.
          c.execute("UPDATE job SET raw=NULL, description_text=NULL WHERE is_match=0")
          c.execute("DELETE FROM job WHERE closed_at IS NOT NULL "
                    "AND datetime(closed_at) < datetime('now','-60 days')")
          c.commit(); c.execute("VACUUM"); c.close()
          PY
          gzip -9f jobs.db
          du -h jobs.db.gz

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: jobs.db.gz
          key: jobs-db-${{ github.run_id }}

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
